<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GINNIMAA - Authentic Indian Spices & Grocery</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="padding:20px;color:#b91c1c;background:#fef2f2;font-family:sans-serif;border:2px solid #ef4444;margin:10px;border-radius:8px;"><h3>App Crash Error:</h3><p><b>' + e.message + '</b></p><p style="font-size:12px;color:#555;">File: ' + (e.filename || 'unknown') + ' (Line: ' + (e.lineno || 0) + ')</p></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="padding:20px;color:#b91c1c;background:#fef2f2;font-family:sans-serif;border:2px solid #ef4444;margin:10px;border-radius:8px;"><h3>Promise/Database Error:</h3><p><b>' + (e.reason ? (e.reason.message || e.reason) : 'Unknown Error') + '</b></p></div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
